[package]
name = "diffnote"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "diffnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# Restores the window's size and position from the last run; the frontend never calls
# it, so capabilities/default.json grants it nothing.
tauri-plugin-window-state = "2"
# Fetch talks to a remote over ssh only, on purpose (ADR 0011). Adding an HTTP
# transport back also means suppressing the credential helper's terminal prompt again
# -- Diffnote has nowhere to answer one, and gix will happily open it.
gix = { version = "0.87", default-features = false, features = [
    "sha1",
    "status",
    "revision",
    "blocking-network-client",
] }

[dev-dependencies]
tempfile = "3"

