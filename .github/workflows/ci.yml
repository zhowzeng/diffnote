name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.platform }})
    # Both platforms Diffnote is meant to run on. The Repo reads that differ between them --
    # path canonicalization, and the system `ssh` a Fetch shells out to -- are exactly
    # what a Linux-only run cannot speak for.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # The `tauri` crate links against these, so even `cargo test` needs them.
      # The list is the one from v2.tauri.app/start/prerequisites.
      - name: Install Tauri's Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Pinned, matching the build workflow: a floating `stable` means a new clippy
      # release can turn an unrelated PR red on a day nobody touched Rust.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Neither answer differs by platform, and running them twice buys a second full
      # compile and nothing else.
      - run: cargo fmt --check
        if: matrix.platform == 'ubuntu-latest'

      - run: cargo clippy --all-targets -- -D warnings
        if: matrix.platform == 'ubuntu-latest'

      # The git CLI builds the fixtures these tests run against; it is already on the
      # runner image.
      - run: cargo test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # svelte-check, which is the only type checking this project has.
      - run: bun run check

      - run: bun run test

      - run: bun run build
